# HYPRLOCK CONFIGURATION

general {
    hide_cursor = true
}

# Background
background {
    color = rgba(12, 14, 22, 1.0)
}

# Clock
label {
    text = $TIME
    color = rgba(235, 235, 245, 1.0)
    font_size = 96
    font_family = Sans

    position = 0, -120
    halign = center
    valign = center
}

# Username
label {
    text = $USER
    color = rgba(165, 170, 190, 1.0)
    font_size = 18
    font_family = Sans

    position = 0, -30
    halign = center
    valign = center
}

# Password input
input-field {
    size = 360, 60
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2

    outer_color = rgba(125, 95, 210, 1.0)
    inner_color = rgba(28, 30, 44, 1.0)
    font_color = rgba(235, 235, 245, 1.0)

    placeholder_text = Digite sua senha
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    fade_on_empty = false
    rounding = 12

    position = 0, 65
    halign = center
    valign = center
}
